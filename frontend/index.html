<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Town — Field Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDE4; --panel:#F3F6EF; --ink:#22303A; --faint:#75857D;
  --line:#C6CFC2; --amber:#B87413; --amber-soft:#B8741322;
  --moss:#5F7D5B; --water:#A9C4C9; --night:#131F35;
  --mono:'Spline Sans Mono',monospace; --body:'Instrument Sans',sans-serif;
  --disp:'Bricolage Grotesque',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.02em}
.wordmark small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);display:block;letter-spacing:.14em}
#clock{font-family:var(--mono);font-size:22px;font-weight:500;min-width:150px}
#daystrip{flex:1;height:6px;border:1px solid var(--line);border-radius:3px;position:relative;background:
  linear-gradient(90deg,#131F35 0%,#131F35 20%,#c98a3a 27%,#f2ecd8 40%,#f2ecd8 62%,#c98a3a 75%,#131F35 85%,#131F35 100%)}
#sun{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);transform:translateX(-50%)}
.controls{display:flex;gap:6px}
.controls button{font-family:var(--mono);font-size:12px;padding:6px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;color:var(--ink);cursor:pointer}
.controls button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.controls button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* layout */
main{flex:1;display:grid;grid-template-columns:1fr 340px;grid-template-rows:minmax(0,1fr);min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
/* absolute-fill so the SVG's viewBox aspect ratio never forces intrinsic height
   (which would overflow a short window); it fills the wrap and `meet` letterboxes inside. */
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);padding:10px 14px 6px}
#feed{flex:1;overflow-y:auto;padding:0 14px 10px;font-size:13px;line-height:1.45}
.ev{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.ev time{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;padding-top:1px}
.ev.dialogue{border-left:3px solid var(--amber);padding-left:8px;background:var(--amber-soft)}
.ev.reflection{border-left:3px solid var(--moss);padding-left:8px}

/* aside tabs (feed | relationship graph) */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs .tab{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);
  background:none;border:none;border-bottom:2px solid transparent;padding:11px 8px 9px;cursor:pointer}
.tabs .tab.active{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .tab:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
[hidden]{display:none!important}

/* relationship graph */
#graph{flex:1;min-height:0;position:relative;overflow:hidden}
#relsvg{width:100%;height:100%;display:block}
.rnode{cursor:pointer}
.rnode-sh{fill:#000;opacity:.10}
.rnode-hit{fill:transparent}
.rnode-name{font-family:var(--mono);font-size:9px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.redge{stroke-linecap:round}
.redge-hit{stroke:transparent;stroke-width:12;fill:none;cursor:pointer}
#reltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--mono);
  font-size:10px;line-height:1.55;padding:5px 8px;border-radius:5px;white-space:nowrap;z-index:5}
#reltip b{font-weight:600;font-family:var(--body)}
@media (prefers-reduced-motion: reduce){ .rnode{transition:none!important} }

/* inspector */
#inspector{border-top:1px solid var(--line);max-height:52%;overflow-y:auto;padding-bottom:12px}
#inspector .placeholder{padding:14px;font-size:13px;color:var(--faint)}
#inspector h2{font-family:var(--disp);font-size:18px;padding:2px 14px 0}
#inspector .sub{font-size:12px;color:var(--faint);padding:0 14px 8px}
.bar{height:7px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss)}
.bar.amber i{background:var(--amber)}
.kv{display:grid;grid-template-columns:86px 1fr 34px;gap:8px;align-items:center;padding:3px 14px;font-size:12px}
.kv b{font-weight:500}
.mem{padding:4px 14px;font-size:12px;border-bottom:1px dashed var(--line)}
.mem time{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:6px}
.mem .imp{font-family:var(--mono);font-size:10px;color:var(--amber);margin-left:6px}
.trace{margin:6px 14px;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--paper)}
.trace .m{font-family:var(--mono);font-size:10px;color:var(--faint)}
.trace b{color:var(--amber)}

/* cost strip */
footer{display:flex;gap:26px;align-items:baseline;padding:8px 18px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;background:var(--panel)}
footer .lab{font-size:10px;letter-spacing:.12em;color:var(--faint)}
footer b{font-weight:500;font-size:14px}
#rulespct b{color:var(--moss)}

/* map svg -- storybook village */
.loc-label{font-family:var(--mono);font-size:10px;font-weight:500;fill:var(--ink);text-anchor:middle}
.loc-kind{font-family:var(--mono);font-size:8px;fill:var(--faint);letter-spacing:.12em;text-anchor:middle}
.shop-rev-g rect{fill:var(--panel);stroke:var(--line);stroke-width:.5}
.shop-rev{font-family:var(--mono);font-size:8.5px;font-weight:500;fill:var(--amber);text-anchor:middle}
#inspector .money{color:var(--amber);font-weight:500}
#terrain,#roads{shape-rendering:crispEdges}
.river-hi{animation:ripple 1.3s steps(2) infinite}
@keyframes ripple{from{transform:translateX(0)}to{transform:translateX(4px)}}

/* pixel-art villagers: frame-based <use> sprites, hard edges, no opacity fades */
.agent{cursor:pointer}
.agent .hit{fill:transparent}
.agent .shadow{fill:#000;opacity:.09}
.agent .fr{visibility:hidden;shape-rendering:crispEdges}
.agent .fr1{visibility:visible;animation:frmflip .8s infinite;animation-delay:var(--d,0s)}
.agent .fr2{animation:frmflip .8s infinite;animation-delay:calc(var(--d,0s) - .4s)}
.agent.walking .fr1{animation-duration:.5s;animation-delay:0s}
.agent.walking .fr2{animation-duration:.5s;animation-delay:-.25s}
.agent.sleeping .fr1,.agent.sleeping .fr2{visibility:hidden;animation:none}
.agent.sleeping .fs{visibility:visible}
.agent .ring{fill:none;stroke:none}
.agent.talking .ring{stroke:var(--amber);stroke-width:2;animation:pulse 1.6s infinite}
.agent .zzz{font-family:var(--disp);font-weight:700;font-size:11px;fill:var(--ink);text-anchor:middle;opacity:0;pointer-events:none}
.agent.sleeping .zzz{animation:zsleep 2.6s ease-in-out infinite}
.nametag rect{fill:var(--panel);stroke:var(--line);stroke-width:.5}
.nametag text{font-family:var(--mono);font-size:8.5px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.bubble rect{fill:var(--ink)}
.bubble text{font-family:var(--body);font-size:11px;fill:var(--paper)}
/* NB: #lights opacity is driven by the `opacity` ATTRIBUTE (set each tick in
   updateClock), NOT a CSS rule -- a CSS `opacity` here would override the
   attribute (presentation attrs rank lowest) and the windows would never glow. */
@keyframes frmflip{0%,49.9%{visibility:visible}50%,100%{visibility:hidden}}
@keyframes zsleep{0%{opacity:0;transform:translateY(0)}30%{opacity:.85}65%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
@keyframes pulse{0%{r:11;stroke-opacity:.9}100%{r:24;stroke-opacity:0}}
@media (prefers-reduced-motion: reduce){
  .agent .fr1,.agent .fr2{animation:none!important}
  .agent .fr1{visibility:visible}.agent .fr2{visibility:hidden}
  .agent.sleeping .fr1{visibility:hidden}.agent.sleeping .fs{visibility:visible}
  .agent.sleeping .zzz{animation:none}
  .agent.talking .ring{animation:none;stroke-opacity:.7}
  .river-hi{animation:none}
  .agent-g{transition:none!important}}
@media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <div class="wordmark">AI TOWN<small data-i18n="subtitle">FIELD STATION · 5 AGENTS</small></div>
  <div id="clock">— —:—</div>
  <div id="daystrip"><div id="sun" style="left:25%"></div></div>
  <div class="controls">
    <button id="btn-pause" data-i18n-title="title.pause" title="Pause simulation">▮▮</button>
    <button id="btn-1" data-i18n-title="title.s1" title="1 sim-minute per second">1×</button>
    <button id="btn-5" class="active" data-i18n-title="title.s5" title="5 sim-minutes per second">5×</button>
    <button id="btn-20" data-i18n-title="title.s20" title="20 sim-minutes per second">20×</button>
    <button id="btn-lang" title="Switch language">中</button>
  </div>
</header>

<main>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Town map">
      <defs id="sprite-defs"><!-- pixel-art villager sprites injected by initSprites() --></defs>
      <rect width="800" height="520" fill="var(--paper)"/>
      <g id="terrain"></g>
      <g id="roads"></g>
      <g id="locs"></g>
      <g id="agents"></g>
      <g id="bubbles"></g>
      <rect id="nightfall" width="800" height="520" fill="var(--night)" opacity="0" pointer-events="none"/>
      <g id="lights" opacity="0" pointer-events="none"></g>
    </svg>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button id="tab-feed" class="tab active" role="tab" data-i18n="feedTitle">EVENT FEED</button>
      <button id="tab-graph" class="tab" role="tab" data-i18n="graphTitle">RELATIONSHIPS</button>
    </div>
    <div id="feed"></div>
    <div id="graph" hidden>
      <svg id="relsvg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Relationship graph"></svg>
      <div id="reltip" hidden></div>
    </div>
    <div id="inspector">
      <div class="eyebrow" data-i18n="inspectorTitle">AGENT INSPECTOR</div>
      <div class="placeholder" data-i18n="inspectorPlaceholder">Select an agent on the map to inspect memories, relationships, and decision traces.</div>
    </div>
  </aside>
</main>

<footer>
  <span><span class="lab" data-i18n="footer.calls">LLM CALLS</span> <b id="u-calls">0</b></span>
  <span><span class="lab" data-i18n="footer.cache">CACHE HITS</span> <b id="u-cache">0</b></span>
  <span><span class="lab" data-i18n="footer.tokens">TOKENS IN/OUT</span> <b id="u-tok">0 / 0</b></span>
  <span><span class="lab" data-i18n="footer.cost">EST. COST</span> <b id="u-cost">$0.000000</b></span>
  <span id="rulespct"><span class="lab" data-i18n="footer.rules">DECISIONS BY RULES</span> <b id="u-rules">—</b></span>
</footer>

<script>
const $=s=>document.querySelector(s);
let LOCS={}, AGENTS={}, selected=null, LOC_LIST=[], ECON=null;

/* ---------- i18n ---------- */
const I18N={
  en:{
    subtitle:'FIELD STATION · 5 AGENTS', feedTitle:'EVENT FEED', graphTitle:'RELATIONSHIPS', inspectorTitle:'AGENT INSPECTOR',
    inspectorPlaceholder:'Select an agent on the map to inspect memories, relationships, and decision traces.',
    energy:'Energy', money:'Money', doing:'Doing', relationships:'RELATIONSHIPS', noRelationships:'No relationships yet.',
    relFriend:'friendship', relTrust:'trust',
    cafeToday:'Today',
    recentMemories:'RECENT MEMORIES', decisionTraces:'DECISION TRACES', noDecisions:'No decisions yet.', imp:'imp',
    'footer.calls':'LLM CALLS','footer.cache':'CACHE HITS','footer.tokens':'TOKENS IN/OUT',
    'footer.cost':'EST. COST','footer.rules':'DECISIONS BY RULES',
    'title.pause':'Pause simulation','title.s1':'1 sim-minute per second','title.s5':'5 sim-minutes per second',
    'title.s20':'20 sim-minutes per second','title.lang':'Switch language', mapAria:'Town map', listSep:', ',
  },
  zh:{
    subtitle:'田野觀測站 · 5 位智能體', feedTitle:'事件動態', graphTitle:'關係圖', inspectorTitle:'智能體檢視器',
    inspectorPlaceholder:'點選地圖上的智能體，檢視其記憶、關係與決策軌跡。',
    energy:'精力', money:'金錢', doing:'狀態', relationships:'人際關係', noRelationships:'尚無人際關係。',
    relFriend:'友誼', relTrust:'信任',
    cafeToday:'今日',
    recentMemories:'近期記憶', decisionTraces:'決策軌跡', noDecisions:'尚無決策。', imp:'重要度',
    'footer.calls':'LLM 呼叫','footer.cache':'快取命中','footer.tokens':'輸入/輸出 Token',
    'footer.cost':'預估成本','footer.rules':'規則決策佔比',
    'title.pause':'暫停模擬','title.s1':'每秒 1 模擬分鐘','title.s5':'每秒 5 模擬分鐘',
    'title.s20':'每秒 20 模擬分鐘','title.lang':'切換語言', mapAria:'小鎮地圖', listSep:'、',
  },
};
const LOC_ZH={home_a:'河畔之家',home_b:'山丘公寓',cafe:'月光咖啡館',office:'湯森辦公室',park:'老橡樹公園'};  // keyed by location id
const KINDS={home:'住家',cafe:'咖啡館',office:'辦公室',park:'公園'};
const ACTIONS={work:'工作',eat:'用餐',move:'移動',sleep:'睡眠',rest:'休息',idle:'閒置',talk:'交談'};
const OCCS={'Cafe Owner':'咖啡館老闆','Office Worker':'上班族','Doctor':'醫生','Retired Teacher':'退休教師','Art Student':'藝術系學生'};
const TRAITS={curious:'好奇',friendly:'友善',gossipy:'八卦',quiet:'安靜',loyal:'忠誠',stressed:'焦慮',
  calm:'冷靜',observant:'敏銳',helpful:'樂於助人',wise:'睿智',talkative:'健談',nostalgic:'念舊',
  creative:'有創意',dreamy:'愛幻想','night-owl':'夜貓子'};
// Confrontation verdicts are a small closed vocabulary (unlike free speech) → map to zh; unknown falls through verbatim.
const SPEECH_ZH={'admitted it':'承認了','denied it':'否認了'};
// Event Contract v1 templates, keyed by ev.verb. (a)ctor, (l)ocation, (tg)target, (sp)eech.
// speech is model-generated free text — inserted verbatim, never translated.
const EV_TMPL={
  en:{
    sleep:(a,l)=>`${a} went to sleep at ${l}`, eat:(a,l)=>`${a} is eating at ${l}`,
    work:(a,l)=>`${a} is working at ${l}`, rest:(a,l)=>`${a} is resting at ${l}`,
    idle:(a,l)=>`${a} is idling at ${l}`, arrive:(a,l)=>`${a} → ${l}`,
    talk_start:(a,l,tg)=>`${a} started talking with ${tg} at ${l}`,
    share_rumor:(a,l,tg,sp)=>`${a} shared a rumor with ${tg}: ${sp}`,
    seek_out:(a,l,tg)=>`${a} went looking for ${tg}`,
    confronted:(a,l,tg,sp)=>`${a} confronted ${tg} about the rumor — they ${sp}`,
    say:(a,l,tg,sp)=>`💬 ${a}: ${sp}`, insight:(a,l,tg,sp)=>`💭 ${a}: ${sp}`,
  },
  zh:{
    sleep:(a,l)=>`${a} 在 ${l} 就寢`, eat:(a,l)=>`${a} 在 ${l} 用餐`,
    work:(a,l)=>`${a} 在 ${l} 工作`, rest:(a,l)=>`${a} 在 ${l} 休息`,
    idle:(a,l)=>`${a} 在 ${l} 閒晃`, arrive:(a,l)=>`${a} 前往 ${l}`,
    talk_start:(a,l,tg)=>`${a} 在 ${l} 開始與 ${tg} 交談`,
    share_rumor:(a,l,tg,sp)=>`${a} 向 ${tg} 傳了個八卦：${sp}`,
    seek_out:(a,l,tg)=>`${a} 去找 ${tg} 了`,
    confronted:(a,l,tg,sp)=>`${a} 當面質問了 ${tg}——對方${SPEECH_ZH[sp]||sp}`,
    say:(a,l,tg,sp)=>`💬 ${a}：${sp}`, insight:(a,l,tg,sp)=>`💭 ${a}：${sp}`,
  },
};
let LANG=localStorage.getItem('lang')||(navigator.language&&navigator.language.startsWith('zh')?'zh':'en');
const t=k=>(I18N[LANG]&&I18N[LANG][k])??I18N.en[k]??k;
const locById=(id,fb)=>LANG==='zh'?(LOC_ZH[id]||fb||id):(fb||id);           // events + map (have the id)
const locByEn=n=>{ if(LANG!=='zh') return n;                                  // inspector (only has English name)
  const h=Object.values(LOCS).find(l=>l.name===n); return (h&&LOC_ZH[h.id])||n; };
const occName=o=>LANG==='zh'?(OCCS[o]||o):o;
const MOOD_EMOJI={upset:'😠',worried:'😟',happy:'🙂'};
const moodEmoji=m=>MOOD_EMOJI[m]?MOOD_EMOJI[m]+' ':'';
const actName=a=>LANG==='zh'?(ACTIONS[a]||a):a;
const traitName=x=>LANG==='zh'?(TRAITS[x]||x):x;
// Render one structured event via its verb template. Unknown verb → deprecated ev.text fallback.
function evText(ev){
  const tmpl=(EV_TMPL[LANG]||EV_TMPL.en)[ev.verb];
  if(!tmpl) return ev.text||'';   // reserved for future verbs (Contract §fallback)
  return tmpl(ev.actor_name||ev.actor, locById(ev.location,ev.location_name), ev.target_name||ev.target, ev.speech||'');
}
// Translate memory text where it follows a known template.
function memText(raw){
  if(LANG!=='zh') return raw;
  const m=raw.match(/^Talked with (.+?) at (.+?)\.$/);
  return m?`與 ${m[1]} 在 ${locByEn(m[2])} 交談。`:raw;
}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle);});
  $('#map').setAttribute('aria-label',t('mapAria'));
  $('#btn-lang').textContent=LANG==='en'?'中':'EN';
  $('#btn-lang').title=t('title.lang');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';
  if(LOC_LIST.length) buildMap(LOC_LIST);                          // relabel map
  $('#feed').querySelectorAll('.ev').forEach(d=>{d.lastChild.textContent=evText(JSON.parse(d.dataset.ev));});
  if(selected) refreshInspector(selected,false);                  // else static placeholder already updated
}
function toggleLang(){ LANG=LANG==='en'?'zh':'en'; localStorage.setItem('lang',LANG); applyLang(); }

/* ---------- websocket ---------- */
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
ws.onmessage=e=>{
  const msg=JSON.parse(e.data);
  if(msg.type==='snapshot'){ buildMap(msg.locations); msg.events.forEach(addEvent); }
  updateClock(msg.minute,msg.clock,msg.paused,msg.speed);
  if(msg.agents) updateAgents(msg.agents);
  if(msg.type==='tick') msg.events.forEach(ev=>{addEvent(ev); maybeBubble(ev);});
};
setInterval(()=>{ if(ws.readyState===1) ws.send('ping'); },15000);

/* ---------- map ---------- */
const SVGNS='http://www.w3.org/2000/svg';
const ROOF={home_a:'#C77A57',home_b:'#7E97C6'};   // two homes, two roof colours

/* ---- pixel-art villager sprites (original GBC-style design) ----
   12x16 logical px @2px each (~24x32 render). Frame-based, built ONCE into
   <defs>; agents only <use> them and toggle a class -- rects are never redrawn.
   Palette per character: o outline, h hair, k skin, e eye, c cloth, d cloth-shadow.
   Cloth hue keeps each agent's existing colour identity. */
const SPR_PAL={
  alice:{o:'#3a2e33',h:'#7a4a24',k:'#f1c7a2',e:'#3a2e33',c:'#E4674F',d:'#b23f2c'},
  bob:  {o:'#2b2630',h:'#2e2a33',k:'#e9be97',e:'#2b2630',c:'#4E86B0',d:'#305f82'},
  carol:{o:'#33262f',h:'#8a4b3b',k:'#f1c7a2',e:'#33262f',c:'#8E6FB3',d:'#64478c'},
  david:{o:'#332b33',h:'#b9b4ae',k:'#e9be97',e:'#332b33',c:'#E0A63C',d:'#b07e22'},
  emma: {o:'#3a2b36',h:'#e3c36b',k:'#f1c7a2',e:'#3a2b36',c:'#D46BA0',d:'#a8407a'},
};
const FALLBACK_ID='alice';
const F1=[
  "....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhkkkkhho.",
  ".ohkkkkkkho.",".ohkekkekho.",".ohkkkkkkho.","..okkkkko...",
  ".occcccccco.",".occcddccco.",".okccccccko.",".occcccccco.",
  ".occcddccco.",".occcccccco.","..oddooddo..","...oo..oo..."];
const F2=F1.slice(); F2[15]="..oo....oo..";      // step: wider stance (+1px bob via transform)
const FS=F1.slice(); FS[5]=".oheekkeeho.";        // sleep: closed eyelids (1px lines)
function rectsFromGrid(rows,pal){                 // run-length merge per row -> fewer rects
  let s='';
  rows.forEach((row,y)=>{ let x=0;
    while(x<row.length){ const ch=row[x];
      if(ch==='.'){x++;continue;}

      x+=run;

function slotOffset(i,n){ const spread=Math.min(n,5); return (i-(spread-1)/2)*24; }
// Standing zone: villagers stand BESIDE the building (on the roomier side of the
// canvas), at roof-mid height so their heads/nametags sit up by the eaves — clear
// of the location label, which lives centred below the building. clampX/clampY then
// guarantee the final point (after slot spread) keeps the whole villager on-canvas.
const FOOT={home:22,cafe:26,office:22,park:34};   // horizontal half-width of each pixel footprint
const clampX=x=>Math.max(26,Math.min(774,x));     // nametag/body stay within [0,800]
const clampY=y=>Math.max(44,Math.min(486,y));     // head origin: feet(+27)<=513, nametag(-24)>=20
function standXY(l,idx,n){
  const half=FOOT[l.kind]||26;
  const halfspread=(Math.min(n,5)-1)/2*24;         // widest slot offset for this crowd
  const off=Math.max(half+18, 40+halfspread);      // push the row out so even the innermost clears the label
  const side=l.x>400?-1:1;                          // right-half locations stand to their left
  return [clampX(l.x+side*off+slotOffset(idx,n)), clampY(l.y+8)];
}

/* ---------- daylight ---------- */
function updateClock(minute,clock,paused,speed){
  $('#clock').textContent=clock;
  const mod=minute%1440, frac=mod/1440;
  $('#sun').style.left=(frac*100)+'%';
  // opacity 0 at 13:00, up to .45 deep night
  const dist=Math.min(Math.abs(mod-780),1440-Math.abs(mod-780));
  const nf=Math.min(.45,Math.max(0,(dist-260)/700));
  $('#nightfall').setAttribute('opacity',nf);
  $('#lights').setAttribute('opacity',(nf/0.45).toFixed(3));   // windows glow as night deepens

  $('#btn-pause').classList.toggle('active',paused);
  ['1','5','20'].forEach(s=>$('#btn-'+s).classList.toggle('active',!paused&&speed==+s));
}

/* ---------- relationship graph (self-written mini force-directed, no deps) ----------
   Model lives in RG {nodes, edges, idx}; physics runs on rAF only while the graph
   tab is visible, and stops (rgRAF=0) once motion settles -> idle CPU stays low.
   Data is re-fetched every 5s: values update in place (no relayout); a genuinely
   new edge adds a line and re-heats the layout for a few frames. */
const REDUCE_MOTION=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RG_CX=150, RG_CY=150;
const K_REP=1600, K_SPRING=0.02, K_CENTER=0.02, DAMP=0.86;
const RLEN_MAX=108, RLEN_MIN=42;   // spring rest length at friendship 0 / 100 (better friends sit closer)
                                   // kept small so the 5-node layout settles inside the box, not on its walls
let RG=null, REL_DATA=null, rgRAF=0, rgCool=0, rgFrames=0;
const favg=e=>(e.friendship_ab+e.friendship_ba)/2;
const ekey=e=>e.a+'|'+e.b;

function simStep(){
  const N=RG.nodes;
  for(const n of N){ n.fx=0; n.fy=0; }
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){       // repulsion (all pairs)
    const a=N[i],b=N[j]; let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
    const f=K_REP/d2, ux=dx/d, uy=dy/d; a.fx+=ux*f; a.fy+=uy*f; b.fx-=ux*f; b.fy-=uy*f;
  }
  for(const e of RG.edges){                                       // springs (edges)
    const a=N[e.ai],b=N[e.bi]; let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
    const L=RLEN_MAX-(favg(e.data)/100)*(RLEN_MAX-RLEN_MIN), f=K_SPRING*(d-L), ux=dx/d, uy=dy/d;
    a.fx+=ux*f; a.fy+=uy*f; b.fx-=ux*f; b.fy-=uy*f;
  }
  let move=0;
  for(const n of N){
    n.fx+=(RG_CX-n.x)*K_CENTER; n.fy+=(RG_CY-n.y)*K_CENTER;       // centering
    n.vx=(n.vx+n.fx)*DAMP; n.vy=(n.vy+n.fy)*DAMP;
    n.x=Math.max(30,Math.min(270,n.x+n.vx)); n.y=Math.max(30,Math.min(260,n.y+n.vy));
    move+=Math.abs(n.vx)+Math.abs(n.vy);
  }
  return move;
}
function renderPositions(){
  if(!RG) return;
  for(const n of RG.nodes) n.el.setAttribute('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
  for(const e of RG.edges){ const a=RG.nodes[e.ai], b=RG.nodes[e.bi];
    for(const ln of [e.line,e.hit]){
      ln.setAttribute('x1',a.x.toFixed(1)); ln.setAttribute('y1',a.y.toFixed(1));
      ln.setAttribute('x2',b.x.toFixed(1)); ln.setAttribute('y2',b.y.toFixed(1));
    }
  }
}
function renderEdgeStyles(){                                       // visual attrs from live values
  if(!RG) return;
  for(const e of RG.edges){ const d=e.data, f=favg(d);
    // dashed = lopsided bond, either way: friendship gap (unrequited) OR trust gap
    // (one-sided distrust after a rumor erodes it). Whichever is wider.
    const conflict=d.conflict_max>25,
      asym=Math.max(Math.abs(d.friendship_ab-d.friendship_ba),Math.abs(d.trust_ab-d.trust_ba))>20;
    e.line.setAttribute('stroke-width',(1+f/100*4).toFixed(2));    // 1..5px by friendship average
    e.line.setAttribute('stroke',conflict?'#C0503A':(f>=55?'#5F7D5B':'#9aa89b'));
    e.line.setAttribute('stroke-dasharray',asym?'4 3':'none');     // dashed = lopsided relationship
    e.line.setAttribute('stroke-opacity','.85');
  }
}
function newEdgeEl(ed){
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','redge-g');
  g.innerHTML=`<line class="redge"/><line class="redge-hit"/>`;
  const e={ai:RG.idx[ed.a],bi:RG.idx[ed.b],data:ed,line:g.querySelector('.redge'),hit:g.querySelector('.redge-hit')};
  const tip=ev=>showRelTip(e,ev);
  e.hit.addEventListener('mousemove',tip); e.hit.addEventListener('mouseenter',tip);
  e.hit.addEventListener('mouseleave',hideRelTip);
  $('#redges').appendChild(g); return e;
}
function buildGraph(data){
  const svg=$('#relsvg'); svg.innerHTML='';
  const nodes=data.nodes.map((n,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/data.nodes.length;
    return {id:n.id,name:n.name,x:RG_CX+Math.cos(ang)*80,y:RG_CY+Math.sin(ang)*80,vx:0,vy:0}; });
  const idx={}; nodes.forEach((n,i)=>idx[n.id]=i);
  const eg=document.createElementNS(SVGNS,'g'); eg.id='redges';           // edges under nodes
  const ng=document.createElementNS(SVGNS,'g'); ng.id='rnodes';
  svg.appendChild(eg); svg.appendChild(ng);
  RG={nodes,edges:[],idx};
  RG.edges=data.edges.map(newEdgeEl);
  nodes.forEach(n=>{ const sid=spriteId(n.id);
    const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','rnode');
    g.innerHTML=`<ellipse class="rnode-sh" cx="0" cy="17" rx="8" ry="2.5"/>
      <g transform="translate(0,-2) scale(0.8)"><use href="#spr-${sid}-f1"/></g>
      <circle class="rnode-hit" r="17"/><text class="rnode-name" y="30"></text>`;
    g.querySelector('.rnode-name').textContent=n.name;
    g.addEventListener('click',()=>inspect(n.id));
    ng.appendChild(g); n.el=g;
  });
  renderEdgeStyles();
  for(let i=0;i<240;i++) simStep();                                        // warm up to a settled layout
  renderPositions(); rgCool=0;
  if(!$('#graph').hidden && !REDUCE_MOTION) startRAF();
}
function applyData(data){
  data.nodes.forEach(n=>{ if(RG.idx[n.id]==null){ buildGraph(data); } });  // node set changed -> rebuild
  if(!RG) return;
  const seen=new Set(RG.edges.map(e=>ekey(e.data))); let added=false;
  data.edges.forEach(ed=>{
    if(seen.has(ekey(ed))){ RG.edges.find(e=>ekey(e.data)===ekey(ed)).data=ed; }
    else{ RG.edges.push(newEdgeEl(ed)); added=true; }                      // brand-new relationship
  });
  data.nodes.forEach(n=>{ const i=RG.idx[n.id]; if(i!=null) RG.nodes[i].name=n.name; });
  renderEdgeStyles();
  if(added) kick();                                                        // only new edges re-heat the layout
}
function rgTick(){ const move=simStep(); renderPositions(); rgFrames++;
  if(move<0.5){ if(++rgCool>15){ rgRAF=0; return; } } else rgCool=0;
  if(rgFrames>500){ rgRAF=0; return; }        // hard cap: guarantee the loop always goes idle
  rgRAF=requestAnimationFrame(rgTick);
}
function startRAF(){
  if(REDUCE_MOTION){ for(let i=0;i<200;i++) simStep(); renderPositions(); rgRAF=0; return; }
  if(!rgRAF){ rgCool=0; rgFrames=0; rgRAF=requestAnimationFrame(rgTick); }
}
function stopRAF(){ if(rgRAF){ cancelAnimationFrame(rgRAF); rgRAF=0; } }
function kick(){ if($('#graph').hidden) return; rgCool=0; startRAF(); }
function showRelTip(e,ev){
  const d=e.data, A=RG.nodes[e.ai].name, B=RG.nodes[e.bi].name, tip=$('#reltip');
  tip.innerHTML=`<b>${A} ↔ ${B}</b><br>${t('relFriend')} ${A}→${B} ${d.friendship_ab} / ${B}→${A} ${d.friendship_ba}`
    +`<br>${t('relTrust')} ${A}→${B} ${d.trust_ab} / ${B}→${A} ${d.trust_ba}`;
  tip.hidden=false;
  const w=$('#graph').getBoundingClientRect();
  let x=ev.clientX-w.left+12, y=ev.clientY-w.top+12;
  x=Math.min(x,w.width-tip.offsetWidth-6); y=Math.min(y,w.height-tip.offsetHeight-6);
  tip.style.left=Math.max(4,x)+'px'; tip.style.top=Math.max(4,y)+'px';
}
function hideRelTip(){ $('#reltip').hidden=true; }
function showTab(which){
  const feed=which!=='graph';
  $('#feed').hidden=!feed; $('#graph').hidden=feed;
  $('#tab-feed').classList.toggle('active',feed);
  $('#tab-graph').classList.toggle('active',!feed);
  if(feed){ stopRAF(); hideRelTip(); return; }
  if(!RG && REL_DATA) buildGraph(REL_DATA);
  else if(RG){ if(REDUCE_MOTION){ for(let i=0;i<120;i++) simStep(); renderPositions(); } else startRAF(); }
}
$('#tab-feed').onclick=()=>showTab('feed');
$('#tab-graph').onclick=()=>showTab('graph');
async function pollRel(){
  try{ const d=await (await fetch('/api/relationships')).json();
    REL_DATA=d;
    if(RG) applyData(d);
    else if(!$('#graph').hidden) buildGraph(d);
  }catch(e){}
}
setInterval(pollRel,5000); pollRel();

/* ---------- economy: live "today's takings" sign on owned shops ---------- */
function renderShopRev(){
  if(!ECON) return;
  ECON.locations.forEach(l=>{
    const el=document.getElementById('rev-'+l.id);
    if(el) el.textContent=`${t('cafeToday')} $${Math.round(l.revenue_today)}`;
  });
}
async function pollEconomy(){
  try{ ECON=await (await fetch('/api/economy')).json(); renderShopRev(); }catch(e){}
}
setInterval(pollEconomy,4000); pollEconomy();
</script>
